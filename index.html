<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Sun Library</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1e1e1e;
      --accent: #ff9800;
      --text: #ffffff;
      --text-dim: #aaaaaa;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background-color: #0f0f0f;
      position: relative;
      padding-bottom: 70px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Header */
    .header {
      padding: 10px 14px;
      background-color: #151515;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #272727;
    }

    .app-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent);
      white-space: nowrap;
    }

    .search-bar-container {
      flex: 1;
      display: flex;
      background: #222;
      border: 1px solid #333;
      border-radius: 20px;
      overflow: hidden;
      padding: 5px 12px;
    }

    .search-bar-container input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    /* Screens */
    .screen {
      display: none;
      padding: 15px;
    }

    .screen.active {
      display: block;
    }

    /* Bottom Navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      height: 60px;
      background: #0f0f0f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #272727;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      width: 25%;
      height: 100%;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      margin-bottom: 3px;
    }

    .nav-item span {
      font-size: 10px;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item.active svg {
      fill: var(--accent);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- HEADER -->
  <div class="header">
    <div class="app-title">☀️ Light Sun</div>
    <div class="search-bar-container">
      <input type="text" placeholder="Search books, comics...">
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="home-screen" class="screen active">
    <h3>Home Screen</h3>
    <p style="color:#aaa;">Yahan books dikhengi.</p>
  </div>

  <!-- COMICS SCREEN -->
  <div id="comics-screen" class="screen">
    <h3>Comics Section (C)</h3>
    <p style="color:#aaa;">Yahan comics dikhengi.</p>
  </div>

  <!-- SAVE SCREEN -->
  <div id="save-screen" class="screen">
    <h3>Saved Items</h3>
    <p style="color:#aaa;">Yahan save ki hui files dikhengi.</p>
  </div>

  <!-- PROFILE SCREEN -->
  <div id="profile-screen" class="screen">
    <h3>Profile & Publisher</h3>
    <p style="color:#aaa;">Yahan profile aur create button hoga.</p>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="switchNav(this, 'home-screen')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'comics-screen')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>C</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'save-screen')">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
      <span>Save</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'profile-screen')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </div>
  </div>

</div>

<script>
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if(target) target.classList.add('active');
  }

  function switchNav(element, screenId) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(element) element.classList.add('active');
    showScreen(screenId);
  }
</script>

</body>
</html>
