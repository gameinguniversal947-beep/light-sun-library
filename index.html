<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Sun Library</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1e1e1e;
      --accent: #ff9800;
      --text: #ffffff;
      --text-dim: #aaaaaa;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background-color: var(--bg-color);
      position: relative;
      padding-bottom: 80px;
      box-sizing: border-box;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Header */
    .header {
      padding: 12px 15px;
      background-color: #151515;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #272727;
    }

    .app-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent);
      white-space: nowrap;
    }

    .search-bar-container {
      flex: 1;
      display: flex;
      background: #222;
      border: 1px solid #333;
      border-radius: 20px;
      overflow: hidden;
      padding: 6px 12px;
    }

    .search-bar-container input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    /* Screens */
    .screen {
      display: none;
      padding: 15px;
    }

    .screen.active {
      display: block;
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1px solid #272727;
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    /* Auth & VIP Cards */
    .auth-card, .vip-card {
      padding: 15px;
      border-radius: 12px;
      color: #fff;
      margin-bottom: 20px;
    }

    .auth-card {
      background: linear-gradient(135deg, #2196F3, #9C27B0);
    }

    .vip-card {
      background: linear-gradient(135deg, #ff9800, #e91e63);
    }

    /* Create Button (+) */
    .create-btn-container {
      text-align: center;
      margin-top: 25px;
      margin-bottom: 20px;
    }

    .create-circle-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: #181818;
      color: var(--accent);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .create-label {
      color: var(--accent);
      font-size: 12px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Bottom Navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 65px;
      background: #0f0f0f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #272727;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      width: 25%;
      height: 100%;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      margin-bottom: 3px;
    }

    .nav-item span {
      font-size: 10px;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item.active svg {
      fill: var(--accent);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- HEADER -->
  <div class="header">
    <div class="app-title">☀️ Light Sun</div>
    <div class="search-bar-container">
      <input type="text" id="header-search" placeholder="Search books, comics..." oninput="handleSearch(this.value)">
    </div>
  </div>

  <!-- 1. HOME SCREEN -->
  <div id="home-screen" class="screen active">
    <h3>Explore Content</h3>
    <div class="grid" id="books-grid"></div>
  </div>

  <!-- 2. COMICS SCREEN -->
  <div id="comics-screen" class="screen">
    <h3>Comics Section (C)</h3>
    <div class="grid" id="comics-grid"></div>
  </div>

  <!-- 3. SAVE SCREEN -->
  <div id="save-screen" class="screen">
    <h3>Saved Items (Library)</h3>
    <div class="grid" id="saved-grid"></div>
  </div>

  <!-- 4. PROFILE SCREEN -->
  <div id="profile-screen" class="screen">
    <h3>Publisher Profile</h3>
    
    <div class="auth-card">
      <h4 style="margin:0;" id="auth-status">Account: Guest</h4>
      <p style="font-size:12px; margin:5px 0 10px 0;">Sign in to sync your library & earnings.</p>
      <button onclick="toggleAuth()" style="padding:6px 12px; background:#fff; color:#000; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">
        Sign In / Sign Up
      </button>
    </div>

    <div class="vip-card">
      <h4 style="margin:0;">VIP 1 Status: <span id="vip-status">Inactive</span></h4>
      <p style="font-size:12px; margin:5px 0 10px 0;">Ad-Free Experience + 30% OFF on Paid Books!</p>
      <button onclick="toggleVIP()" style="padding:6px 12px; background:#fff; color:#000; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">
        Toggle VIP 1
      </button>
    </div>

    <h3>Your Published Content</h3>
    <div class="grid" id="my-books-grid"></div>

    <div class="create-btn-container">
      <div class="create-circle-btn" onclick="showScreen('create-screen')">+</div>
      <div class="create-label">create</div>
    </div>
  </div>

  <!-- CREATE / PUBLISH SCREEN -->
  <div id="create-screen" class="screen">
    <button onclick="showScreen('profile-screen')" class="btn" style="width:auto; padding:6px 14px; margin-bottom:15px; font-size:13px;">← Back</button>
    <h3>Publish New Content</h3>

    <form id="publish-form" onsubmit="handlePublish(event)">
      <div class="form-group">
        <label>Type</label>
        <select id="pub-type">
          <option value="book">Book</option>
          <option value="comic">Comic</option>
        </select>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="pub-title" required placeholder="Enter Title">
      </div>

      <div class="form-group">
        <label>Price (Max ₹1000)</label>
        <input type="number" id="pub-price" min="0" max="1000" required placeholder="Enter Price">
      </div>

      <div class="form-group">
        <label>Thumbnail Image (Cover Thumbnail)</label>
        <input type="file" id="pub-image" accept="image/*" required>
      </div>

      <div class="form-group">
        <label>File Input (PDF / Book / Comic File)</label>
        <input type="file" id="pub-file" accept=".pdf,.epub,.cbz" required>
      </div>

      <button type="submit" class="btn">Scan & Publish</button>
    </form>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="switchNav(this, 'home-screen')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'comics-screen')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>C</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'save-screen')">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
      <span>Save</span>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'profile-screen')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </div>
  </div>

</div>

<script>
  let isVIP = false;
  let isLoggedIn = false;

  let defaultItems = [
    { id: 1, type: 'book', title: 'Solar Adventure', price: 200, image: 'https://via.placeholder.com/150' },
    { id: 2, type: 'comic', title: 'Shadow Hunter Comic', price: 0, image: 'https://via.placeholder.com/150' }
  ];

  let items = [];
  try {
    let saved = localStorage.getItem('lightSunItems');
    items = saved ? JSON.parse(saved) : defaultItems;
    if(!Array.isArray(items) || items.length === 0) items = defaultItems;
  } catch(e) {
    items = defaultItems;
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if(target) target.classList.add('active');
    window.scrollTo(0, 0);
  }

  function switchNav(element, screenId) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(element) element.classList.add('active');
    showScreen(screenId);
  }

  function renderGrids(filter = '') {
    const homeGrid = document.getElementById('books-grid');
    const comicsGrid = document.getElementById('comics-grid');
    const savedGrid = document.getElementById('saved-grid');
    const myGrid = document.getElementById('my-books-grid');
    
    if(!homeGrid || !comicsGrid || !savedGrid || !myGrid) return;

    homeGrid.innerHTML = '';
    comicsGrid.innerHTML = '';
    savedGrid.innerHTML = '';
    myGrid.innerHTML = '';

    let filtered = items.filter(i => i && i.title && i.title.toLowerCase().includes(filter.toLowerCase()));

    filtered.forEach(item => {
      let finalPrice = isVIP && item.price > 0 ? Math.round(item.price * 0.7) : item.price;
      let priceTag = item.price === 0 ? "FREE" : `₹${finalPrice} ${isVIP ? '(VIP 30% OFF)' : ''}`;

      let cardHTML = `
        <div class="card">
          <img src="${item.image}" alt="cover">
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-price">${priceTag}</div>
          </div>
        </div>
      `;

      homeGrid.innerHTML += cardHTML;
      if(item.type === 'comic') {
        comicsGrid.innerHTML += cardHTML;
      }
      savedGrid.innerHTML += cardHTML;
      myGrid.innerHTML += cardHTML;
    });
  }

  function handleSearch(query) {
    renderGrids(query);
  }

  function toggleVIP() {
    isVIP = !isVIP;
    document.getElementById('vip-status').innerText = isVIP ? "ACTIVE (No Ads + 30% OFF)" : "Inactive";
    renderGrids();
  }

  function toggleAuth() {
    isLoggedIn = !isLoggedIn;
    document.getElementById('auth-status').innerText = isLoggedIn ? "Account: Vashu Dev (Signed In)" : "Account: Guest";
  }

  function handlePublish(event) {
    event.preventDefault();
    const type = document.getElementById('pub-type').value;
    const title = document.getElementById('pub-title').value;
    const price = parseInt(document.getElementById('pub-price').value);
    const imageInput = document.getElementById('pub-image');

    alert("Scanning files for adult content...");

    setTimeout(() => {
      alert("Adult Content Check Passed! Published Successfully.");

      const reader = new FileReader();
      reader.onload = function(e) {
        const imageUrl = e.target.result;

        items.push({
          id: Date.now(),
          type: type,
          title: title,
          price: price,
          image: imageUrl
        });

        localStorage.setItem('lightSunItems', JSON.stringify(items));
        renderGrids();
        document.getElementById('publish-form').reset();
        showScreen('profile-screen');
      };

      if (imageInput.files && imageInput.files[0]) {
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        items.push({
          id: Date.now(),
          type: type,
          title: title,
          price: price,
          image: 'https://via.placeholder.com/150'
        });
        localStorage.setItem('lightSunItems', JSON.stringify(items));
        renderGrids();
        document.getElementById('publish-form').reset();
        showScreen('profile-screen');
      }
    }, 1000);
  }

  renderGrids();
</script>

</body>
        </html>
